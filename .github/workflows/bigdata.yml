name: EA3 - Pipeline Completo de Big Data

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl requests lxml html5lib

    - name: Run Enrichment Pipeline (EA3)
      run: python src/enrichment.py

    - name: Commit and Push Enriched Artifacts
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        git diff-index --quiet HEAD || git commit -m "Auto: Ejecucion automatizada EA3 [GitHub Actions]"
        git push origin main
